<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>青春时光 - 北京时间</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="bg-container">
        <div class="bg-layer active" id="bg-layer-1"></div>
        <div class="bg-layer" id="bg-layer-2"></div>
    </div>
    
    <div class="bg-loader" id="bgLoader">
        <div class="loader-spinner"></div>
        <div class="loader-text">背景加载中...</div>
    </div>
    
    <div class="container">
        <header>
            <div class="logo-container">
                <div class="logo">
                    <i class="fas fa-clock"></i>
                    <h1>青春时光</h1>
                </div>
                <div class="countdowns-container" id="topCountdowns">
                    <span class="countdown-item gaokao-countdown" id="gaokaoCountdown">
                        <i class="fas fa-graduation-cap"></i>
                        <span id="gaokaoText">高考倒计时计算中...</span>
                    </span>
                    <span class="next-exam-container" id="nextExamContainer">
                        <span class="countdown-item next-exam" id="nextExam">
                            <i class="fas fa-book-open"></i>
                            <span id="nextExamText">下一科：语文</span>
                        </span>
                    </span>
                </div>
            </div>
            <div class="controls">
                <button type="button" class="btn btn-outline" id="themeBtn" aria-label="切换主题">
                    <i class="fas fa-sync-alt"></i>
                    <span class="tooltip">切换主题</span>
                </button>
                <button type="button" class="btn" id="fullscreenBtn" aria-label="全屏显示">
                    <i class="fas fa-expand"></i>
                    <span class="tooltip">全屏显示</span>
                </button>
                <button type="button" class="btn" id="settingsBtn">
                    <i class="fas fa-cog"></i> 设置
                    <span class="tooltip">个性化设置</span>
                </button>
            </div>
        </header>
        
        <div class="content-wrapper">
            <div class="main-content">
                <div class="time-section">
                    <div class="date-display" id="dateDisplay">2023年10月15日 星期日</div>
                    <div class="time-display">
                        <span id="hours">14</span>
                        <span class="colon" id="colonAfterHour">:</span>
                        <span id="minutes">30</span>
                        <span class="colon" id="colonAfterMinute">:</span>
                        <span id="seconds">45</span>
                        <span class="milliseconds">.<span id="milliseconds">789</span></span>
                    </div>
                </div>
                
                <div class="quote-section">
                    <div class="quote-header">
                        <h2><i class="fas fa-quote-left"></i> 每日金句</h2>
                        <div class="api-status" id="apiStatusContainer">
                            <div class="status-indicator" id="apiStatus"></div>
                            <span id="apiStatusText">API正常</span>
                            <div class="quote-progress-container">
                                <div class="quote-progress-bar" id="quoteProgressBar"></div>
                            </div>
                        </div>
                    </div>
                    <div class="quote-content" id="quoteContent">
                        <div class="quote-text">生活就像骑自行车，为了保持平衡，你必须不断前进。<span class="cursor"></span></div>
                    </div>
                    <div class="quote-author" id="quoteAuthor">—— 爱因斯坦 · 物理学家</div>
                    <div class="quote-type" id="quoteType">哲学</div>
                </div>
            </div>
            
            <div class="countdown-sidebar" id="countdownSidebar">
                <div class="countdown-panel" id="countdownPanel">
                    <div class="countdown-panel-title">
                        <i class="fas fa-calendar-days"></i> 倒数日
                    </div>
                    <div class="countdown-items-container" id="countdownPanelItems"></div>
                    <div class="holiday-image-container">
                        <img src="https://www.kanostar.top/holidays/img" alt="放假倒计时">
                    </div>
                </div>
             </div>
        </div>
        
        <div class="settings-panel" id="settingsPanel">
            <div class="settings-header">
                <h2><i class="fas fa-cog"></i> 个性化设置</h2>
                <div class="settings-buttons">
                    <button type="button" class="btn btn-outline" id="cancelSettingsBtn">
                        <i class="fas fa-times"></i> 取消更改
                    </button>
                    <button type="button" class="btn" id="saveSettingsBtn" style="margin-left: 10px;">
                        <i class="fas fa-check"></i> 保存并退出
                    </button>
                </div>
            </div>
            
            <div class="settings-grid">
                <div class="setting-group" id="displaySettingsGroup">
                    <div class="setting-group-header">
                        <h3><i class="fas fa-desktop"></i> 显示设置</h3>
                        <i class="fas fa-chevron-down toggle-icon"></i>
                    </div>
                    <div class="setting-group-content">
                        <div class="checkbox-group">
                            <label class="checkbox-item"><input type="checkbox" id="showDate" checked> 显示日期</label>
                            <label class="checkbox-item"><input type="checkbox" id="showSeconds" checked> 显示秒钟</label>
                            <label class="checkbox-item"><input type="checkbox" id="showMilliseconds"> 显示毫秒</label>
                            <label class="checkbox-item"><input type="checkbox" id="showGaokao" checked> 显示高考倒计时</label>
                            <label class="checkbox-item"><input type="checkbox" id="showQuoteProgress" checked> 显示金句进度条</label>
                            <label class="checkbox-item"><input type="checkbox" id="showBgProgress" checked> 显示背景进度条</label>
                        </div>
                        <div class="radio-group" style="margin-top: 10px;">
                            <label class="radio-item"><input type="radio" name="displayPriority" id="quotePriority" value="quote" checked> 金句优先</label>
                            <label class="radio-item"><input type="radio" name="displayPriority" id="timePriority" value="time"> 时间优先</label>
                        </div>
                    </div>
                </div>
                
                <div class="setting-group" id="countdownSettingsGroup">
                    <div class="setting-group-header">
                        <h3><i class="fas fa-calendar-days"></i> 倒数日设置</h3>
                        <i class="fas fa-chevron-down toggle-icon"></i>
                    </div>
                    <div class="setting-group-content">
                        <div class="checkbox-item">
                            <input type="checkbox" id="showHolidayImage" checked> 
                            <label for="showHolidayImage">显示放假倒计时图片</label>
                        </div>
                        <div class="countdowns-form">
                            <div class="form-group">
                                <label for="countdownTitle">内容 (最多10字)</label>
                                <input type="text" id="countdownTitle" class="form-control" maxlength="10" placeholder="例如：期末考试">
                            </div>
                            <div class="form-group">
                                <label for="countdownDate">时间</label>
                                <input type="datetime-local" id="countdownDate" class="form-control">
                            </div>
                            <button type="button" class="btn" id="addCountdownBtn"><i class="fas fa-plus"></i> 添加倒数日</button>
                        </div>
                        <div class="countdowns-list" id="countdownsList"></div>
                    </div>
                </div>
                
                <div class="setting-group" id="bgSettingsGroup">
                    <div class="setting-group-header">
                        <h3><i class="fas fa-palette"></i> 背景设置</h3>
                        <i class="fas fa-chevron-down toggle-icon"></i>
                    </div>
                    <div class="setting-group-content">
                        <div class="background-options">
                            <div class="bg-input-group">
                                <input type="text" id="bgUrl" class="bg-input" placeholder="输入背景图片URL">
                                <button type="button" class="btn" id="saveBgBtn" aria-label="保存背景"><i class="fas fa-save"></i></button>
                            </div>
                            <button type="button" class="btn" id="bgLocalBtn"><i class="fas fa-image"></i> 选择本地图片</button>
                            <div class="preset-buttons">
                                <button type="button" class="preset-btn" data-preset="none">无背景</button>
                                <button type="button" class="preset-btn" data-preset="weimei">唯美</button>
                                <button type="button" class="preset-btn" data-preset="bluearchive">蔚蓝档案</button>
                                <button type="button" class="preset-btn" data-preset="anime">二次元</button>
                                <button type="button" class="preset-btn" data-preset="yuanshen">原神</button>
                                <button type="button" class="preset-btn" data-preset="random">随机</button>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="setting-group" id="quoteSettingsGroup">
                    <div class="setting-group-header">
                        <h3><i class="fas fa-quote-right"></i> 金句设置</h3>
                        <i class="fas fa-chevron-down toggle-icon"></i>
                    </div>
                    <div class="setting-group-content">
                        <div class="type-controls">
                            <button type="button" class="btn btn-small" id="selectAllBtn"><i class="fas fa-check-square"></i> 全选</button>
                            <button type="button" class="btn btn-small btn-outline" id="deselectAllBtn"><i class="far fa-square"></i> 全不选</button>
                            <button type="button" class="btn btn-small" id="toggleGuaranteeBtn"><i class="fas fa-shield-alt"></i> 保底机制: 开</button>
                        </div>
                        <div class="checkbox-group">
                            <label class="checkbox-item"><input type="checkbox" name="quoteType" value="a" checked> 动画</label>
                            <label class="checkbox-item"><input type="checkbox" name="quoteType" value="b"> 漫画</label>
                            <label class="checkbox-item"><input type="checkbox" name="quoteType" value="c" checked> 游戏</label>
                            <label class="checkbox-item"><input type="checkbox" name="quoteType" value="d"> 文学</label>
                            <label class="checkbox-item"><input type="checkbox" name="quoteType" value="e" checked> 原创</label>
                            <label class="checkbox-item"><input type="checkbox" name="quoteType" value="f" checked> 网络</label>
                            <label class="checkbox-item"><input type="checkbox" name="quoteType" value="g"> 其他</label>
                            <label class="checkbox-item"><input type="checkbox" name="quoteType" value="h" checked> 影视</label>
                            <label class="checkbox-item"><input type="checkbox" name="quoteType" value="i"> 诗词</label>
                            <label class="checkbox-item"><input type="checkbox" name="quoteType" value="j"> 网易云</label>
                            <label class="checkbox-item"><input type="checkbox" name="quoteType" value="k" checked> 哲学</label>
                            <label class="checkbox-item"><input type="checkbox" name="quoteType" value="l"> 抖机灵</label>
                            <label class="checkbox-item"><input type="checkbox" name="quoteType" value="m" id="extensionType" checked> 拓展</label>
                        </div>
                        <div class="tag-filter-container" id="tagFilterContainer">
                            <div class="tag-filter-title"><i class="fas fa-tags"></i> 标签过滤</div>
                            <div class="tag-filter-group" id="tagFilterGroup"></div>
                        </div>
                        <div style="margin-top: 15px;">
                            <h4><i class="fas fa-film"></i> 金句动画效果</h4>
                            <div class="radio-group">
                                <label class="radio-item"><input type="radio" name="quoteAnimation" id="typewriterAnimation" value="typewriter" checked> 打字机效果</label>
                                <label class="radio-item"><input type="radio" name="quoteAnimation" id="noAnimation" value="none"> 无动画</label>
                            </div>
                        </div>
                        <div class="api-status">
                            <div class="status-indicator" id="extStatus"></div>
                            <span id="extStatusText">拓展金句: 已启用 (5条)</span>
                            <button type="button" class="download-btn" id="downloadExtBtn" title="重新下载拓展金句"><i class="fas fa-download"></i></button>
                        </div>
                    </div>
                </div>
                
                <div class="setting-group" id="intervalSettingsGroup">
                    <div class="setting-group-header">
                        <h3><i class="fas fa-history"></i> 定时设置</h3>
                        <i class="fas fa-chevron-down toggle-icon"></i>
                    </div>
                    <div class="setting-group-content">
                        <div class="interval-controls">
                            <div class="interval-control"><label for="quoteInterval">金句更换间隔 (分钟)</label><input type="number" id="quoteInterval" min="0.5" step="0.5" value="1"></div>
                            <div class="interval-control"><label for="bgInterval">背景更换间隔 (分钟)</label><input type="number" id="bgInterval" min="0.5" step="0.5" value="30"></div>
                        </div>
                    </div>
                </div>
                
                <div class="setting-group" id="subjectSettingsGroup">
                    <div class="setting-group-header">
                        <h3><i class="fas fa-book"></i> 高考科目设置</h3>
                        <i class="fas fa-chevron-down toggle-icon"></i>
                    </div>
                    <div class="setting-group-content">
                        <div class="subject-group">
                            <label class="subject-item"><input type="checkbox" name="ignoredSubject" value="语文" checked> 语文</label>
                            <label class="subject-item"><input type="checkbox" name="ignoredSubject" value="数学" checked> 数学</label>
                            <label class="subject-item"><input type="checkbox" name="ignoredSubject" value="英语" checked> 英语</label>
                            <label class="subject-item"><input type="checkbox" name="ignoredSubject" value="物理"> 物理</label>
                            <label class="subject-item"><input type="checkbox" name="ignoredSubject" value="历史"> 历史</label>
                            <label class="subject-item"><input type="checkbox" name="ignoredSubject" value="化学"> 化学</label>
                            <label class="subject-item"><input type="checkbox" name="ignoredSubject" value="地理"> 地理</label>
                            <label class="subject-item"><input type="checkbox" name="ignoredSubject" value="政治"> 政治</label>
                            <label class="subject-item"><input type="checkbox" name="ignoredSubject" value="生物"> 生物</label>
                        </div>
                    </div>
                </div>
                
                <div class="setting-group" id="resetSettingsGroup">
                    <div class="setting-group-header"><h3><i class="fas fa-redo"></i> 重置设置</h3><i class="fas fa-chevron-down toggle-icon"></i></div>
                    <div class="setting-group-content"><button type="button" class="btn reset-btn" id="resetBtn"><i class="fas fa-trash-restore"></i> 恢复默认设置</button></div>
                </div>
                
                <div class="setting-group" id="refreshSettingsGroup">
                    <div class="setting-group-header"><h3><i class="fas fa-sync-alt"></i> 刷新操作</h3><i class="fas fa-chevron-down toggle-icon"></i></div>
                    <div class="setting-group-content">
                        <div class="action-buttons">
                            <button type="button" class="action-btn" id="refreshQuoteBtn"><i class="fas fa-quote-right"></i> 立即更换金句</button>
                            <button type="button" class="action-btn" id="refreshBgBtn"><i class="fas fa-image"></i>立即更换背景</button>
                        </div>
                    </div>
                </div>
                
                <div class="setting-group" id="aboutSettingsGroup">
                    <div class="setting-group-header"><h3><i class="fas fa-info-circle"></i> 关于</h3><i class="fas fa-chevron-down toggle-icon"></i></div>
                    <div class="setting-group-content"><button type="button" class="btn" id="aboutBtn"><i class="fas fa-external-link-alt"></i> 关于青春时光/北京时间的说明</button></div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="bg-progress progress-container" id="bgProgress">
        <div class="progress-bar" id="bgProgressBar"></div>
    </div>
    
    <button type="button" class="floating-btn" id="refreshBtn" aria-label="刷新"><i class="fas fa-sync-alt"></i></button>
    
    <div class="toast" id="toast"><i class="fas fa-check-circle"></i><span id="toastMessage">操作成功！</span></div>
    
    <video id="noSleepVideo" playsinline muted loop style="display: none;">
        <source src="data:video/mp4;base64,AAAAHGZ0eXBpc29tAAACAGlzb21pc28yYXZjMW1wNDEAAAAIZnJlZQAAAZhtZGF0AAAAMgYF//+Z3EXpvebZSLeWLNgg2SPu73gyNjQgLSBjb3JlIDE0OCByMjkzMSAxNzcxYjM1IC0gSC4yNjQvTVBFRy00IEFWQyBjb2RlYyAtIENvcHlsZWZ0IDIwMDMtMjAxNyAtIGh0dHA6Ly93d3cudmlkZW9sYW4ub3JnL3gyNjQuaHRtbCAtIG9wdGlvbnM6IGNhYmFjPTEgcmVmPTMgZGVibG9jaz0xOjA6MCBhbmFseXNlPTB4MzoweDExMyBtZT1oZXggc3VibWU9NyBwc3k9MSBwc3lfcmQ9MS4wMDowLjAwIG1peGVkX3JlZj0xIG1lX3JhbmdlPTE2IGNocm9tYV9tZT0xIHRyZWxsaXM9MSA4eDhkY3Q9MSBjcW09MCBkZWFkem9uZT0yMSwxMSBmYXN0X3BzaWtQPTAgY2hyb21hX3FwX29mZnNldD0tMiB0aHJlYWRzPTMgbG9va2FoZWFkX3RocmVhZHM9MSBzbGljZWRfdGhyZWFkcz0wIG5yPTAgZGVjaW1hdGU9MSBpbnRlcmxhY2VkPTAgYmx1cmF5X2NvbXBhdD0wIGNvbnN0cmFpbmVkX2ludHJhPTAgYmZyYW1lcz0zIGJfcHlyYW1pZD0yIGJfYWRhcHQ9MSBiX2JpYXM9MCBkaXJlY3Q9MSB3ZWlnaHRiPTEgb3Blbl9nb3A9MCB3ZWlnaHRwPTIga2V5aW50PTI1MCBrZXlpbnRfbWluPTEwIHNjZW5lY3V0PTQwIGludHJhX3JlZnJlc2g9MCByY19sb29rYWhlYWQ9NDAgcmM9Y3JmIG1idHJlZT0xIGNyZj0yMy4wIHFjb21wPTAuNjAgcXBtaW49MCBxcG1heD02OSBxcHN0ZXA9NCBpcF9yYXRpbz0xLjQwIGFxPTE6MS4wMACAAAABdGWIhAAv//72rvzLK0cLlS4dccVkpMgggICAgggICAF0=" type="video/mp4">
    </video>

    <script src="js/script.js"></script>
</body>
</html>
