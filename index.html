<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>青春时光 - 北京时间</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #6e8efb;
            --secondary: #a777e3;
            --accent: #ff6b6b;
            --text: #333;
            --bg: #ffffff;
            --card-bg: rgba(255, 255, 255, 0.50);
            --shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            --gaokao-color: #ff6b6b;
            --progress-normal: #2ecc71;
            --progress-warning: #e74c3c;
        }
        .dark-theme {
            --primary: #8aa2ff;
            --secondary: #c097f5;
            --accent: #ff8e8e;
            --text: #f0f0f0;
            --bg: #1a1a2e;
            --card-bg: rgba(30, 30, 46, 0.50);
            --shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
            --gaokao-color: #ff8e8e;
        }
        .ocean-theme {
            --primary: #3498db;
            --secondary: #1abc9c;
            --accent: #9b59b6;
            --text: #2c3e50;
            --bg: #ecf0f1;
            --card-bg: rgba(236, 240, 241, 0.50);
            --gaokao-color: #e74c3c;
        }
        .forest-theme {
            --primary: #27ae60;
            --secondary: #f39c12;
            --accent: #c0392b;
            --text: #34495e;
            --bg: #ecf0f1;
            --card-bg: rgba(236, 240, 241, 0.50);
            --gaokao-color: #16a085;
        }
        .sunset-theme {
            --primary: #e74c3c;
            --secondary: #e67e22;
            --accent: #9b59b6;
            --text: #2c3e50;
            --bg: #f5d76e;
            --card-bg: rgba(245, 215, 110, 0.50);
            --gaokao-color: #c0392b;
        }
        .midnight-theme {
            --primary: #8e44ad;
            --secondary: #3498db;
            --accent: #1abc9c;
            --text: #ecf0f1;
            --bg: #2c3e50;
            --card-bg: rgba(44, 62, 80, 0.50);
            --shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            --gaokao-color: #9b59b6;
        }
        .sakura-theme {
            --primary: #e84393;
            --secondary: #fd79a8;
            --accent: #6c5ce7;
            --text: #2d3436;
            --bg: #ffcccc;
            --card-bg: rgba(255, 204, 204, 0.50);
            --gaokao-color: #e84393;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: var(--text);
            overflow: hidden;
            position: relative;
            padding: 10px;
            background-size: cover;
            background-position: center;
        }
        .container {
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        /* 顶部卡片优化 */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(5px);
            flex-wrap: wrap;
            min-height: 80px;
        }
        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 200px;
            max-width: 60%;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo h1 {
            font-size: 1.6rem;
            background: linear-gradient(45deg, var(--accent), #ffa502);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: 800;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            white-space: nowrap;
        }
        .logo i {
            font-size: 1.8rem;
            color: var(--accent);
        }
        .countdowns-container {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            max-width: 100%;
            flex: 1;
            min-width: 0;
        }
        .countdown-item {
            font-size: 1.1rem;
            background: rgba(106, 17, 203, 0.1);
            padding: 6px 12px;
            border-radius: 20px;
            color: var(--primary);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            text-align: center;
            line-height: 1.3;
            min-width: 140px;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .gaokao-countdown {
            animation: pulse 2s infinite;
        }
        .next-exam {
            font-size: 1rem;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: flex-end;
            flex: 1;
            min-width: fit-content;
        }
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 50px;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            color: white;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            font-size: 1rem;
            position: relative;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
        }
        .btn-outline {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
        }
        .btn-small {
            padding: 5px 12px;
            font-size: 0.9rem;
        }
        .tooltip {
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 1000;
        }
        .btn:hover .tooltip {
            opacity: 1;
        }
        
        /* 主内容区域布局优化 - 减小卡片高度 */
        .content-wrapper {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            position: relative;
        }
        .main-content {
            flex: 1;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            transition: transform 0.4s ease;
        }
        .settings-open .main-content {
            transform: translateY(-100%);
        }
        .countdown-sidebar {
            width: 300px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        /* 减小卡片高度 */
        .time-section {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            height: 200px;
            min-height: 200px;
            max-height: 200px;
            width: 100%;
        }
        .quote-section {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            box-shadow: var(--shadow);
            position: relative;
            height: 30px;
            min-height: 240px;
            max-height: 240px;
            width: 100%;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(5px);
        }
        
        .date-display {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text);
            text-align: center;
        }
        .time-display {
            font-size: 3.8rem;
            font-weight: 800;
            color: var(--text);
            text-align: center;
            font-family: 'Courier New', monospace;
            letter-spacing: 1px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 5px;
            transition: font-size 0.3s ease;
        }
        .milliseconds {
            font-size: 1.8rem;
            color: var(--accent);
            align-self: flex-end;
            margin-bottom: 5px;
        }
        
        .countdown-panel {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 15px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 12px;
            backdrop-filter: blur(5px);
            height: 100%;
            position: relative;
        }
        .countdown-panel-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .countdown-panel-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: rgba(106, 17, 203, 0.05);
            border-radius: 12px;
            margin-bottom: 6px;
            font-size: 0.95rem;
        }
        .countdown-panel-item-title {
            font-weight: 600;
            color: var(--text);
            flex: 2;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .countdown-panel-item-time {
            font-weight: 700;
            color: var(--accent);
            font-size: 1rem;
            flex: 1;
            text-align: right;
            min-width: fit-content;
        }
        
        /* 布局优先级设置 */
        .quote-priority .time-section {
            flex: 1;
        }
        .quote-priority .quote-section {
            flex: 2;
        }
        .quote-priority .time-display {
            font-size: 3.3rem;
        }
        .quote-priority .quote-content {
            font-size: 1.8rem;
        }
        .time-priority .time-section {
            flex: 2;
        }
        .time-priority .quote-section {
            flex: 1;
        }
        .time-priority .time-display {
            font-size: 4.8rem;
        }
        .time-priority .quote-content {
            font-size: 1.4rem;
        }
        .quote-hidden .quote-section {
            display: none;
        }
        .quote-hidden .time-section {
            height: 70vh;
            justify-content: center;
        }
        .quote-hidden .time-display {
            font-size: 5.5rem !important;
        }
        
        /* 固定卡片大小 */
        .fixed-cards .time-section,
        .fixed-cards .quote-section {
            height: 200px;
            min-height: 200px;
            max-height: 200px;
            overflow: hidden;
        }
        .fixed-cards .time-section {
            justify-content: center;
        }
        .fixed-cards .quote-content {
            overflow: auto;
        }
        
        /* 金句部分优化 */
        .quote-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .quote-header h2 {
            font-size: 1.3rem;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .quote-content {
            font-size: 1.6rem;
            line-height: 1.4;
            text-align: center;
            color: var(--text);
            font-style: italic;
            padding: 0 15px;
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .quote-text {
            max-height: 100%;
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 3;
            overflow: hidden;
            text-overflow: ellipsis;
            padding: 5px 0;
            width: 100%;
            text-align: center;
        }
        .quote-content::before,
        .quote-content::after {
            content: '"';
            font-size: 2.5rem;
            color: rgba(106, 17, 203, 0.2);
            position: absolute;
            z-index: 1;
        }
        .quote-content::before {
            top: 5px;
            left: 5px;
        }
        .quote-content::after {
            bottom: 5px;
            right: 5px;
        }
        .quote-author {
            font-size: 1.1rem;
            text-align: right;
            color: var(--text);
            opacity: 0.8;
            margin-top: 8px;
            padding-right: 15px;
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .quote-type {
            font-size: 0.9rem;
            position: absolute;
            bottom: 12px;
            left: 15px;
            background: rgba(106, 17, 203, 0.1);
            color: var(--primary);
            padding: 4px 12px;
            border-radius: 16px;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 80%;
        }
        .cursor {
            display: inline-block;
            width: 2px;
            height: 1.8rem;
            background: var(--accent);
            margin-left: 3px;
            vertical-align: middle;
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        .settings-panel {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            box-shadow: var(--shadow);
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            transform: translateY(0);
            transition: transform 0.4s ease;
            z-index: 10;
        }
        .settings-open .settings-panel {
            transform: translateY(-100%);
        }
        .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .settings-header h2 {
            font-size: 1.6rem;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .settings-buttons {
            display: flex;
            gap: 10px;
        }
        .settings-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            max-height: 70vh;
            overflow-y: auto;
            padding-right: 10px;
        }
        .settings-grid::-webkit-scrollbar {
            width: 8px;
        }
        .settings-grid::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
            border-radius: 4px;
        }
        .settings-grid::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 4px;
        }
        .setting-group {
            background: rgba(245, 245, 245, 0.3);
            padding: 15px;
            border-radius: 16px;
        }
        .dark-theme .setting-group,
        .ocean-theme .setting-group,
        .forest-theme .setting-group,
        .sunset-theme .setting-group,
        .midnight-theme .setting-group,
        .sakura-theme .setting-group {
            background: rgba(40, 40, 60, 0.5);
        }
        .setting-group h3 {
            font-size: 1.3rem;
            margin-bottom: 15px;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 10px;
        }
        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 1rem;
        }
        .checkbox-item input {
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
        }
        .radio-group {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }
        .radio-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 1rem;
        }
        .background-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .bg-input-group {
            display: flex;
            gap: 10px;
        }
        .bg-input {
            flex: 1;
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            background: rgba(255, 255, 255, 0.5);
        }
        .dark-theme .bg-input,
        .ocean-theme .bg-input,
        .forest-theme .bg-input,
        .sunset-theme .bg-input,
        .midnight-theme .bg-input,
        .sakura-theme .bg-input {
            background: rgba(30, 30, 50, 0.5);
            color: var(--text);
            border-color: #444;
        }
        .preset-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }
        .preset-btn {
            flex: 1;
            min-width: 110px;
            padding: 8px 12px;
            border: none;
            border-radius: 8px;
            background: rgba(110, 142, 251, 0.15);
            color: var(--primary);
            font-weight: 500;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s;
            font-size: 0.95rem;
        }
        .preset-btn:hover {
            background: rgba(110, 142, 251, 0.25);
            transform: translateY(-2px);
        }
        .preset-btn.active {
            background: var(--primary);
            color: white;
        }
        .interval-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 10px;
        }
        .interval-control {
            flex: 1;
            min-width: 200px;
        }
        .interval-control label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: var(--primary);
            font-size: 1rem;
        }
        .interval-control input {
            width: 100%;
            padding: 8px 12px;
            border: 2px solid var(--primary);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.5);
            font-size: 1.05rem;
        }
        .dark-theme .interval-control input,
        .ocean-theme .interval-control input,
        .forest-theme .interval-control input,
        .sunset-theme .interval-control input,
        .midnight-theme .interval-control input,
        .sakura-theme .interval-control input {
            background: rgba(30, 30, 50, 0.5);
            color: var(--text);
            border-color: var(--secondary);
        }
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .action-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: rgba(110, 142, 251, 0.15);
            color: var(--primary);
            font-weight: 500;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s;
            font-size: 1rem;
        }
        .action-btn:hover {
            background: rgba(110, 142, 251, 0.25);
            transform: translateY(-2px);
        }
        .api-status {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 12px;
            padding: 8px;
            border-radius: 8px;
            background: rgba(106, 17, 203, 0.05);
            font-size: 0.95rem;
        }
        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #2ecc71;
        }
        .status-indicator.offline {
            background: #e74c3c;
        }
        .download-btn {
            background: transparent;
            border: none;
            color: var(--primary);
            cursor: pointer;
            font-size: 1rem;
            padding: 5px;
            margin-left: 5px;
        }
        .download-btn:hover {
            color: var(--accent);
            transform: scale(1.1);
        }
        .pulse {
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }
        .floating-btn {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            z-index: 100;
            border: none;
        }
        .floating-btn.hidden {
            opacity: 0;
            pointer-events: none;
            transform: translateY(20px);
        }
        .floating-btn:hover {
            transform: translateY(-5px) rotate(15deg);
        }
        .type-controls {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .blink-colon {
            animation: blink 1s infinite;
        }
        .progress-container {
            position: absolute;
            height: 5px;
            background: rgba(0, 0, 0, 0.1);
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            width: 100%;
            transform-origin: left;
            transform: scaleX(1);
            transition: transform 0.3s linear;
        }
        .bg-progress {
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 1000;
        }
        .toast {
            position: fixed;
            top: 25px;
            right: 25px;
            background: var(--card-bg);
            color: var(--text);
            padding: 18px 28px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 12px;
            transform: translateX(120%);
            transition: transform 0.3s ease-out;
        }
        .toast.show {
            transform: translateX(0);
        }
        .toast i {
            font-size: 1.6rem;
            color: #2ecc71;
        }
        .reset-btn {
            background: rgba(255, 107, 107, 0.1);
            color: var(--gaokao-color);
            border: 1px solid var(--gaokao-color);
        }
        .reset-btn:hover {
            background: rgba(255, 107, 107, 0.2);
        }
        .quote-progress-container {
            width: 120px;
            height: 8px;
            background: rgba(0, 0, 0, 0.1);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
            margin-left: 12px;
        }
        .quote-progress-bar {
            height: 100%;
            width: 100%;
            transform-origin: left;
            transform: scaleX(0);
            transition: transform 0.3s linear;
        }
        
        /* 防休眠模式状态指示器 */
        .no-sleep-indicator {
            position: fixed;
            bottom: 25px;
            left: 25px;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 99;
        }
        .no-sleep-indicator .indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #2ecc71;
            animation: pulse 1.5s infinite;
        }
        .no-sleep-indicator .indicator.inactive {
            background-color: #e74c3c;
        }
        
        /* 科目设置样式 */
        .subject-group {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }
        .subject-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.95rem;
        }
        .subject-item input {
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
        }
        .next-exam-container {
            margin-left: 10px;
            display: none;
        }
        .gaokao-exam {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        /* 倒数日设置样式 */
        .countdowns-form {
            display: grid;
            gap: 12px;
            margin-top: 15px;
        }
        .form-group {
            display: grid;
            gap: 8px;
        }
        .form-group label {
            font-weight: 500;
            color: var(--primary);
        }
        .form-control {
            padding: 10px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.5);
            font-size: 1rem;
        }
        .dark-theme .form-control {
            background: rgba(30, 30, 50, 0.5);
            color: var(--text);
            border-color: #444;
        }
        .countdowns-list {
            margin-top: 15px;
            max-height: 300px;
            overflow-y: auto;
            padding-right: 5px;
        }
        .countdowns-list::-webkit-scrollbar {
            width: 6px;
        }
        .countdowns-list::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 3px;
        }
        .countdown-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid rgba(0,0,0,0.1);
        }
        .countdown-item-info {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 0;
        }
        .countdown-item-title {
            font-weight: 600;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .countdown-item-date {
            font-size: 0.85rem;
            opacity: 0.8;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .countdown-item-actions {
            display: flex;
            gap: 5px;
            flex-shrink: 0;
        }
        .countdown-edit-btn, .countdown-delete-btn, .countdown-toggle-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            padding: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            border-radius: 50%;
        }
        .countdown-edit-btn {
            color: var(--primary);
        }
        .countdown-delete-btn {
            color: var(--accent);
        }
        .countdown-toggle-btn {
            color: #27ae60;
        }
        .countdown-toggle-btn.hidden {
            color: #e74c3c;
        }
        .countdown-edit-btn:hover, .countdown-delete-btn:hover, .countdown-toggle-btn:hover {
            transform: scale(1.1);
            background: rgba(0,0,0,0.05);
        }
        
        /* 金句动画样式 */
        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .slide-up {
            animation: slideUp 0.5s ease-out;
        }
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        /* 居中内容 */
        .centered-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
        }
        
        /* 优化后的倒数日图片容器 */
        .holiday-image-container {
            width: 207px;
            height: 186.3px;
            margin: 15px auto 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, rgba(255,255,255,0.25), rgba(255,255,255,0.15));
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            transition: all 0.3s ease;
        }
        .holiday-image-container img {
            width: 100%;
            height: auto;
            object-fit: contain;
        }
        .countdown-items-container {
            flex: 1;
            overflow-y: auto;
            max-height: calc(100% - 110px);
            padding-right: 5px;
        }
        .countdown-items-container::-webkit-scrollbar {
            width: 6px;
        }
        .countdown-items-container::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 3px;
        }
        .hide-holiday-image .holiday-image-container {
            display: none;
        }
        
        /* 响应式设计 - 优化布局 */
        @media (max-width: 1024px) {
            .content-wrapper {
                flex-direction: column;
            }
            .countdown-sidebar {
                width: 100%;
                flex-direction: row;
                flex-wrap: wrap;
            }
            .countdown-panel {
                flex: 1;
                min-width: 300px;
            }
            .time-display {
                font-size: 3.5rem;
            }
            .quote-content {
                font-size: 1.4rem;
            }
        }
        
        @media (max-width: 900px) {

            }

                font-size: 3.3rem;
            }
            .quote-content {
                font-size: 1.4rem;
            }
            .time-section {
                padding: 15px;
            }
            .quote-section {
                padding: 15px;
            }
        }
        
        @media (max-width: 768px) {

                flex-direction: column;
                gap: 15px;
            }
            .logo-container {
                width: 100%;
                max-width: 100%;

            }

            /* 修复设置面板位置 */

        @media (max-width: 600px) {

            }

            /* 设置面板进一步调整 */

        @media (max-width: 480px) {
            .logo-container {
                flex-direction: column;
                text-align: center;
            }
            .logo h1 {
                flex-direction: row;
                align-items: center;

            }
            .countdowns-container {
                justify-content: center;
                margin-top: 8px;
            }
            .next-exam-container {
                margin-left: 0;
                margin-top: 8px;

            }
            .time-display {
                font-size: 2.5rem;
            }
            .milliseconds {
                font-size: 1.2rem;
            }
            .quote-hidden .time-display {
                font-size: 3.5rem !important;
            }
            .date-display {
                font-size: 1.1rem;
            }
            .quote-content {
                font-size: 1.1rem;
            }
            .quote-author {
                font-size: 0.9rem;
            }
            .bg-input-group {
                flex-direction: column;
            }
            .preset-buttons {
                flex-direction: column;
            }
            .preset-btn {
                width: 100%;
            }
            .quote-progress-container {
                width: 60px;
            }
            .btn .tooltip {
                display: none;
            }
            .settings-grid {
                max-height: 50vh;
            }
            .action-buttons {

            }
            .countdown-item {
                min-width: 120px;

            .holiday-image-container {
                margin: 10px auto 5px;

        }
        
        @media (max-width: 360px) {
            .time-display {
                font-size: 2.2rem;
                flex-wrap: wrap;

                font-size: 3rem !important;
            }

            }

        @media (max-width: 360px) and (orientation: portrait) {

        @media (max-height: 480px) and (orientation: landscape) {

</head>
<body>
    <div class="container">
        <header>
            <div class="logo-container">
                <div class="logo">
                    <i class="fas fa-clock"></i>
                    <h1>青春时光</h1>
                </div>
                <div class="countdowns-container" id="topCountdowns">
                    <span class="countdown-item gaokao-countdown" id="gaokaoCountdown">
                        <i class="fas fa-graduation-cap"></i>
                        <span id="gaokaoText">高考倒计时计算中...</span>
                    </span>
                    <span class="next-exam-container" id="nextExamContainer">
                        <span class="countdown-item next-exam" id="nextExam">
                            <i class="fas fa-book-open"></i>
                            <span id="nextExamText">下一科：语文</span>
                        </span>
                    </span>
                </div>
            </div>
            <div class="controls">
                <button type="button" class="btn btn-outline" id="themeBtn" aria-label="切换主题">
                    <i class="fas fa-sync-alt"></i>
                    <span class="tooltip">切换主题</span>
                </button>
                <button type="button" class="btn" id="fullscreenBtn" aria-label="全屏显示">
                    <i class="fas fa-expand"></i>
                    <span class="tooltip">全屏显示</span>
                </button>
                <button type="button" class="btn" id="settingsBtn">
                    <i class="fas fa-cog"></i> 设置
                    <span class="tooltip">个性化设置</span>
                </button>
            </div>
        </header>
        
        <div class="content-wrapper">
            <div class="main-content">
                <div class="time-section">
                    <div class="date-display" id="dateDisplay">2023年10月15日 星期日</div>
                    <div class="time-display">
                        <span id="hours">14</span>
                        <span class="colon" id="colonAfterHour">:</span>
                        <span id="minutes">30</span>
                        <span class="colon" id="colonAfterMinute">:</span>
                        <span id="seconds">45</span>
                        <span class="milliseconds">.<span id="milliseconds">789</span></span>
                    </div>
                </div>
                
                <div class="quote-section">
                    <div class="quote-header">
                        <h2><i class="fas fa-quote-left"></i> 每日金句</h2>
                        <div class="api-status" id="apiStatusContainer">
                            <div class="status-indicator" id="apiStatus"></div>
                            <span id="apiStatusText">API正常</span>
                            <div class="quote-progress-container">
                                <div class="quote-progress-bar" id="quoteProgressBar"></div>
                            </div>
                        </div>
                    </div>
                    <div class="quote-content" id="quoteContent">
                        <div class="quote-text">生活就像骑自行车，为了保持平衡，你必须不断前进。<span class="cursor"></span></div>
                    </div>
                    <div class="quote-author" id="quoteAuthor">—— 爱因斯坦 · 物理学家</div>
                    <div class="quote-type" id="quoteType">哲学</div>
                </div>
            </div>
            
            <div class="countdown-sidebar">
                <div class="countdown-panel" id="countdownPanel">
                    <div class="countdown-panel-title">
                        <i class="fas fa-calendar-days"></i> 倒数日
                    </div>
                    <div class="countdown-items-container" id="countdownPanelItems"></div>
                    <div class="holiday-image-container">
                        <img src="https://www.kanostar.top/holidays/img" alt="放假倒计时">
                    </div>
                </div>
             </div>
        </div>
        
        <div class="settings-panel" id="settingsPanel">
            <div class="settings-header">
                <h2><i class="fas fa-cog"></i> 个性化设置</h2>
                <div class="settings-buttons">
                    <button type="button" class="btn btn-outline" id="cancelSettingsBtn">
                        <i class="fas fa-times"></i> 取消更改
                    </button>
                    <button type="button" class="btn" id="saveSettingsBtn" style="margin-left: 10px;">
                        <i class="fas fa-check"></i> 保存并退出
                    </button>
                </div>
            </div>
            
            <div class="settings-grid">

                            <input type="checkbox" id="showDate" checked> 显示日期
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" id="showSeconds" checked> 显示秒钟
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" id="showMilliseconds"> 显示毫秒
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" id="showGaokao" checked> 显示高考倒计时
                        </label>
                    </div>
                </div>
                
                <div class="setting-group">

                        </label>
                    </div>
                </div>
                
                <div class="setting-group">
                    <h3><i class="fas fa-calendar-days"></i> 倒数日设置</h3>

                        <input type="checkbox" id="showHolidayImage" checked>

                    </div>
                    <div class="countdowns-form">

                        </div>
                        <div class="form-group">
                            <label for="countdownDate">时间</label>
                            <input type="datetime-local" id="countdownDate" class="form-control">

                        <button type="button" class="btn" id="addCountdownBtn">
                            <i class="fas fa-plus"></i> 添加倒数日
                        </button>
                    </div>
                    <div class="countdowns-list" id="countdownsList"></div>

                            <i class="far fa-square"></i> 全不选

                        <label class="checkbox-item">
                            <input type="checkbox" name="quoteType" value="b"> 漫画

                        <label class="checkbox-item">
                            <input type="checkbox" name="quoteType" value="c" checked> 游戏
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" name="quoteType" value="d"> 文学
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" name="quoteType" value="e"> 原创
                        </label>
                        <label class="checkbox-item">

                        <label class="checkbox-item">

                        <label class="checkbox-item">

                        <label class="checkbox-item">

        // 初始化自定义倒数日

        // 渲染倒数日列表
        function renderCountdownsList() {
            countdownsListEl.innerHTML = '';
            
            countdowns.forEach(countdown => {
                const countdownItem = document.createElement('div');

                    </div>
                    <div class="countdown-item-actions">
                        <button class="countdown-toggle-btn ${countdown.hidden ? 'hidden' : ''}" data-id="${countdown.id}" title="${countdown.hidden ? '显示' : '隐藏'}">
                            <i class="fas ${countdown.hidden ? 'fa-eye-slash' : 'fa-eye'}"></i>
                        </button>
                        <button class="countdown-edit-btn" data-id="${countdown.id}" title="编辑">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button class="countdown-delete-btn" data-id="${countdown.id}" title="删除">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                `;
                countdownsListEl.appendChild(countdownItem);
            });
            
            // 添加事件监听
            document.querySelectorAll('.countdown-edit-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = btn.dataset.id;
                    editCountdown(id);
                });
            });
            
            document.querySelectorAll('.countdown-delete-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = btn.dataset.id;
                    deleteCountdown(id);
                });
            });
            
            document.querySelectorAll('.countdown-toggle-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = btn.dataset.id;
                    toggleCountdownVisibility(id);
                });
            });
        }
        
        // 切换倒数日可见性
        function toggleCountdownVisibility(id) {
            const index = countdowns.findIndex(c => c.id === parseInt(id));
            if (index !== -1) {
                countdowns[index].hidden = !countdowns[index].hidden;
                localStorage.setItem('countdowns', JSON.stringify(countdowns));
                renderCountdownsList();
                updateCountdownDisplay();
                showToast(`已${countdowns[index].hidden ? '隐藏' : '显示'}该倒数日`);
            }
        }
        
        // 格式化日期
        function formatDate(date) {
            return `${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日`;
        }
        
        // 添加自定义倒数日
        function addCountdown() {
            const title = countdownTitleInput.value.trim();
            const dateValue = countdownDateInput.value;
            
            if (!title) {
                showToast('请输入事件内容');
                return;
            }
            
            if (title.length > 10) {
                showToast('事件内容最多10个字');
                return;
            }
            
            if (!dateValue) {
                showToast('请选择结束时间');
                return;
            }
            
            const endDate = new Date(dateValue);
            
            const newCountdown = {
                id: Date.now(),
                title,
                endDate: endDate.toISOString(),
                hidden: false
            };
            
            if (editingCountdownId) {
                // 更新现有倒数日
                const index = countdowns.findIndex(c => c.id === editingCountdownId);
                if (index !== -1) {
                    countdowns[index] = newCountdown;
                    showToast('倒数日已更新');
                }
                editingCountdownId = null;
            } else {
                // 添加新倒数日
                countdowns.push(newCountdown);
                showToast('倒数日已添加');
            }
            
            // 保存到localStorage
            localStorage.setItem('countdowns', JSON.stringify(countdowns));
            
            // 清空表单
            countdownTitleInput.value = '';
            countdownDateInput.value = '';
            
            // 更新显示
            renderCountdownsList();
            updateCountdownDisplay();
        }
        
        // 编辑倒数日
        function editCountdown(id) {
            const countdown = countdowns.find(c => c.id === parseInt(id));
            if (countdown) {
                countdownTitleInput.value = countdown.title;
                countdownDateInput.value = formatDateTimeLocal(new Date(countdown.endDate));
                editingCountdownId = countdown.id;
                
                // 滚动到表单
                document.querySelector('.countdowns-form').scrollIntoView({ behavior: 'smooth' });
            }
        }
        
        // 格式化日期时间本地格式
        function formatDateTimeLocal(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            
            return `${year}-${month}-${day}T${hours}:${minutes}`;
        }
        
        // 删除倒数日
        function deleteCountdown(id) {
            if (confirm('确定要删除这个倒数日吗？')) {
                countdowns = countdowns.filter(c => c.id !== parseInt(id));
                localStorage.setItem('countdowns', JSON.stringify(countdowns));
                renderCountdownsList();
                updateCountdownDisplay();
                showToast('倒数日已删除');
            }
        }
        
        // 更新倒数日显示
        function updateCountdownDisplay() {
            const now = new Date(Date.now() + timeOffset);
            
            // 更新顶部显示
            updateTopCountdowns(now);
            
            // 更新面板显示
            updateCountdownPanel(now);
            
            // 倒数日面板始终显示
            document.querySelector('.countdown-sidebar').style.display = 'flex';
        }
        
        // 更新顶部倒数日
        function updateTopCountdowns(now) {
            // 清空顶部倒数日容器
            topCountdownsEl.innerHTML = '';
            
            // 显示高考倒计时（如果启用）
            if (showGaokaoCheckbox.checked) {
                topCountdownsEl.appendChild(gaokaoCountdownEl);
            }
            
            // 过滤出非隐藏的倒数日
            const visibleCountdowns = countdowns.filter(c => !c.hidden);
            
            // 最多显示2个自定义倒数日（加上高考最多3个）
            const maxCountdowns = Math.min(2, visibleCountdowns.length);
            
            // 添加自定义倒数日
            for (let i = 0; i < maxCountdowns; i++) {
                const countdown = visibleCountdowns[i];
                const timeDiff = calculateTimeDiff(now, new Date(countdown.endDate));
                
                const countdownItem = document.createElement('span');
                countdownItem.className = 'countdown-item';
                countdownItem.innerHTML = `
                    <i class="fas fa-calendar"></i>
                    <span>${countdown.title}：${formatTimeDiff(timeDiff)}</span>
                `;
                topCountdownsEl.appendChild(countdownItem);
            }
        }
        
        // 计算时间差
        function calculateTimeDiff(now, targetDate) {
            // 确保目标日期在当前时间之后
            if (targetDate < now) {
                return { days: 0, hours: 0, minutes: 0 };
            }
            
            const timeDiff = targetDate - now;
            const days = Math.floor(timeDiff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((timeDiff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((timeDiff % (1000 * 60 * 60)) / (1000 * 60));
            
            return { days, hours, minutes };
        }
        
        // 格式化时间差
        function formatTimeDiff(timeDiff) {
            if (timeDiff.days > 0) {
                return `${timeDiff.days}天${timeDiff.hours}小时`;
            } else if (timeDiff.hours > 0) {
                return `${timeDiff.hours}小时${timeDiff.minutes}分钟`;
            } else {
                return `${timeDiff.minutes}分钟`;
            }
        }
        
        // 更新倒数日面板
        function updateCountdownPanel(now) {
            // 清空面板内容
            countdownPanelItemsEl.innerHTML = '';
            
            // 添加高考倒计时（如果启用）
            if (showGaokaoCheckbox.checked) {
                const gaokaoTimeDiff = calculateGaokaoTimeDiff(now);
                if (gaokaoTimeDiff !== null) {
                    const gaokaoItem = document.createElement('div');
                    gaokaoItem.className = 'countdown-panel-item';
                    gaokaoItem.innerHTML = `
                        <div class="countdown-panel-item-title">高考倒计时</div>
                        <div class="countdown-panel-item-time">${formatTimeDiff(gaokaoTimeDiff)}</div>
                    `;
                    countdownPanelItemsEl.appendChild(gaokaoItem);
                }
            }
            
            // 添加自定义倒数日（无论是否隐藏）
            countdowns.forEach(countdown => {
                const timeDiff = calculateTimeDiff(now, new Date(countdown.endDate));
                
                const countdownItem = document.createElement('div');
                countdownItem.className = 'countdown-panel-item';
                countdownItem.innerHTML = `
                    <div class="countdown-panel-item-title">${countdown.title}</div>
                    <div class="countdown-panel-item-time">${formatTimeDiff(timeDiff)}</div>
                `;
                countdownPanelItemsEl.appendChild(countdownItem);
            });
            
            // 如果没有倒数日，显示提示
            if (countdownPanelItemsEl.children.length === 0) {
                const emptyItem = document.createElement('div');
                emptyItem.className = 'countdown-panel-item';
                emptyItem.innerHTML = `
                    <div class="countdown-panel-item-title">暂无倒数日</div>

        // 获取北京时间
        async function fetchBeijingTime() {
            try {
                const response = await fetch('https://api.allorigins.win/get?url=https://f.m.suning.com/api/ct.do00');
                if (!response.ok) throw new Error('时间API请求失败');

        function updateGaokaoCountdown() {
            const now = new Date(Date.now() + timeOffset);
            const currentYear = now.getFullYear();
            
            // 高考日期范围：6月7日 00:00 至 6月9日 23:59:59.999
            const gaokaoStart = new Date(currentYear, 5, 7);
            const gaokaoEnd = new Date(currentYear, 5, 9, 23, 59, 59, 999);
            
            // 如果当前时间在高考期间内
            if (now >= gaokaoStart && now <= gaokaoEnd) {
                gaokaoTextEl.innerHTML = `${currentYear}年高考进行中！<br>加油！`;
                gaokaoCountdownEl.style.background = 'rgba(106, 17, 203, 0.2)';
                return;
            }
            
            // 确定目标高考日期（当前年或下一年）
            let targetGaokao = gaokaoStart;
            if (now > gaokaoEnd) {
                targetGaokao = new Date(currentYear + 1, 5, 7);
            }
            
            const timeDiff = targetGaokao.getTime() - now.getTime();
            
            // 高考已结束（理论上不会触发，保留安全判断）
            if (timeDiff < 0) {
                gaokaoTextEl.innerHTML = `${targetGaokao.getFullYear()}年高考已结束！`;
                gaokaoCountdownEl.style.background = 'rgba(106, 17, 203, 0.1)';
                return;
            }
            
            // 计算倒计时
            const daysDiff = Math.floor(timeDiff / (1000 * 60 * 60 * 24));
            const hoursDiff = Math.floor((timeDiff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutesDiff = Math.floor((timeDiff % (1000 * 60 * 60)) / (1000 * 60));
            
            // 高考当天特殊处理（已覆盖在高考期间判断）
            gaokaoTextEl.innerHTML = `距离${targetGaokao.getFullYear()}年高考还有<br>${daysDiff}天${hoursDiff}小时${minutesDiff}分钟`;
            gaokaoCountdownEl.style.background = 'rgba(106, 17, 203, 0.1)';
        }
        
        // 更新下一科考试信息
        function updateNextExam() {
            const now = new Date(Date.now() + timeOffset);
            const currentYear = now.getFullYear();
            
            // 检查是否为高考期间（6月7、8、9日）
            const month = now.getMonth() + 1; // 月份从0开始
            const date = now.getDate();
            
            if (month !== 6 || date < 7 || date > 9) {
                nextExamContainer.style.display = 'none';
                return;
            }
            
            // 显示考试信息框
            nextExamContainer.style.display = 'inline-block';
            
            // 找到下一科考试
            let nextExam = null;
            let minTimeDiff = Infinity;
            
            for (const subject of examSubjects) {
                // 检查科目是否被忽略
                if (ignoredSubjects.includes(subject.name)) continue;
                
                // 解析日期和时间
                const [month, day] = subject.date.split('-');
                const [hours, minutes] = subject.startTime.split(':');
                
                // 创建考试日期对象（当前年份）
                const examDate = new Date(currentYear, parseInt(month) - 1, parseInt(day), 
                    parseInt(hours), parseInt(minutes));
                
                // 计算时间差
                const timeDiff = examDate - now;
                
                // 如果考试尚未开始，且时间差小于当前最小时间差
                if (timeDiff > 0 && timeDiff < minTimeDiff) {
                    minTimeDiff = timeDiff;
                    nextExam = subject;
                }
            }
            
            if (nextExam) {
                // 计算倒计时
                const hoursLeft = Math.floor(minTimeDiff / (1000 * 60 * 60));
                const minutesLeft = Math.floor((minTimeDiff % (1000 * 60 * 60)) / (1000 * 60));
                
                nextExamText.innerHTML = `下一科是: ${nextExam.name}<br>距离开考仅剩: ${hoursLeft}时${minutesLeft}分`;
            } else {
                // 所有考试都已结束
                nextExamText.innerHTML = "所有科目考试结束";
            }
        }
